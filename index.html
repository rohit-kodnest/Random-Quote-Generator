<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded shadow-md text-center max-w-lg">
        <h1 class="text-2xl font-bold mb-4">Random Quote Generator</h1>
        <p id="quote" class="text-xl italic mb-6">"Click below to generate a new quote"</p>
        <button id="generate-btn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-700">
            Generate Quote
        </button>
    </div>
    <script src="js/main.js" defer></script>
</body>
</html>
